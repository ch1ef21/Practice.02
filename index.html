<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Микросервисный Магазин — Листинг и Статус</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: sans-serif; }
        .navbar-brand { font-weight: bold; }
        .status-dot { width: 12px; height: 12px; display: inline-block; border-radius: 50%; margin-right: 6px; }
        .bg-online { background-color: #28a745; box-shadow: 0 0 8px #28a745; }
        .bg-offline { background-color: #dc3545; box-shadow: 0 0 8px #dc3545; }
    </style>
</head>
<body>

    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container d-flex justify-content-between align-items-center">
            <span class="navbar-brand mb-0 h1">📦 Microshop Панель</span>
            <div class="d-flex gap-3 align-items-center">
                <span class="text-light small">
                    Каталог (5001): 
                    <span id="catalog-status-badge" class="badge bg-secondary">
                        <span id="catalog-dot" class="status-dot bg-offline"></span><span id="catalog-text">CHECKING</span>
                    </span>
                </span>
                <span class="text-light small">
                    Корзина (5002): 
                    <span id="cart-status-badge" class="badge bg-secondary">
                        <span id="cart-dot" class="status-dot bg-offline"></span><span id="cart-text">CHECKING</span>
                    </span>
                </span>
                <span class="text-muted">|</span>
                <span class="text-light">User: <strong>student_77</strong></span>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row">
            <div class="col-12">
                <div class="card shadow-sm">
                    <div class="card-header bg-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0">Листинг товаров (catalog-service)</h5>
                        <button class="btn btn-sm btn-outline-secondary" onclick="loadProducts()">🔄 Обновить товары</button>
                    </div>
                    <div class="card-body">
                        
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>ID</th>
                                        <th>Название товара</th>
                                        <th>Цена</th>
                                        <th>Остаток на складе</th>
                                        <th class="text-end">Действие</th>
                                    </tr>
                                </thead>
                                <tbody id="products-table-body">
                                    <tr>
                                        <td colspan="5" class="text-center text-muted py-4">
                                            <div class="spinner-border spinner-border-sm me-2" role="status"></div>
                                            Загрузка товаров...
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CATALOG_URL = 'http://localhost:5001/products';
        const CART_URL = 'http://localhost:5002/cart/add';

        async function checkServicesHealth() {
            try {
                const res = await fetch(CATALOG_URL, { method: 'GET' });
                if (res.ok) {
                    updateStatus('catalog', true);
                } else {
                    updateStatus('catalog', false);
                }
            } catch (err) {
                updateStatus('catalog', false);
            }

            try {
                
                const res = await fetch('http://localhost:5002/', { method: 'GET' });
                updateStatus('cart', true); 
            } catch (err) {
                if (err.message.includes('Failed to fetch')) {
                    updateStatus('cart', false);
                } else {
                    updateStatus('cart', true);
                }
            }
        }

        function updateStatus(service, isOnline) {
            const dot = document.getElementById(`${service}-dot`);
            const text = document.getElementById(`${service}-text`);
            const badge = document.getElementById(`${service}-status-badge`);

            if (isOnline) {
                dot.className = "status-dot bg-online";
                text.innerText = "ONLINE";
                badge.className = "badge bg-success bg-opacity-25 text-success border border-success";
            } else {
                dot.className = "status-dot bg-offline";
                text.innerText = "OFFLINE";
                badge.className = "badge bg-danger bg-opacity-25 text-danger border border-danger";
            }
        }

        async function loadProducts() {
            const tableBody = document.getElementById('products-table-body');
            try {
                const response = await fetch(CATALOG_URL);
                if (!response.ok) throw new Error();
                const products = await response.json();
                tableBody.innerHTML = '';

                products.forEach(product => {
                    const isOutOfStock = product.stock <= 0;
                    tableBody.innerHTML += `
                        <tr>
                            <td><strong>${product.id}</strong></td>
                            <td>${product.name}</td>
                            <td><span class="badge bg-success">${product.price} $</span></td>
                            <td><span class="badge ${product.stock <= 2 ? 'bg-danger' : 'bg-secondary'}">${product.stock} шт.</span></td>
                            <td class="text-end">
                                <button class="btn btn-primary btn-sm" onclick="addToCart(${product.id})" ${isOutOfStock ? 'disabled' : ''}>
                                    ${isOutOfStock ? 'Нет в наличии' : '🛒 В корзину'}
                                </button>
                            </td>
                        </tr>
                    `;
                });
            } catch (error) {
                tableBody.innerHTML = `<tr><td colspan="5" class="text-center text-danger py-4">Ошибка загрузки товаров. Сервис каталога недоступен.</td></tr>`;
            }
        }

        async function addToCart(productId) {
            try {
                const response = await fetch(CART_URL, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ user_id: 'student_77', product_id: productId, quantity: 1 })
                });

                if (response.ok) {
                    alert(`Товар ${productId} добавлен в корзину!`);
                } else {
                    const err = await response.json();
                    alert(`Ошибка: ${err.error}`);
                }
            } catch (error) {
                alert('Ошибка сети: Сервис корзины недоступен.');
            }
        }

        window.onload = () => {
            loadProducts();
            checkServicesHealth();
            setInterval(checkServicesHealth, 5000);
        };
    </script>
</body>
</html>
