
services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: rabbitmq
    ports:
      - "5672:5672"   
      - "15672:15672" 
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  db:
    image: postgres:15-alpine
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: password
      POSTGRES_DB: microservices_db
    ports:
      - "5432:5432"
    volumes:
      - ./init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d microservices_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - microservice-network

  catalog-service:
    build:
      context: .
      dockerfile: ./app/Dockerfile
    container_name: catalog-app
    ports:
      - "5015:5001"
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/microservices_db
    restart: always
    depends_on:
      db:
        condition: service_healthy
    networks:
      - microservice-network
      
  catalog-worker:
    build: 
      context: .
      dockerfile: app/Dockerfile
    container_name: catalog-worker
    command: python consumer.py
    environment:
      - DATABASE_URL=postgresql://user:password@db:5432/microservices_db
      - RABBITMQ_HOST=rabbitmq
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-network
      
  cart-service:
    build:
      context: .
      dockerfile: cart/Dockerfile
    container_name: cart-app
    ports:
      - "5002:5002"
    environment:
      - CATALOG_BASE_URL=http://catalog-service:5001 
      - ORDER_SERVICE_URL=http://order-service:3000
      - DATABASE_URL=postgresql://user:password@db:5432/microservices_db
    depends_on:
      db:
        condition: service_healthy
      catalog-service:
        condition: service_started
    networks:
      - microservice-network

  order-service:
    build:
      context: .
      dockerfile: orders/Dockerfile
    container_name: order-app
    ports:
      - "8080:3000"  
    environment:
      - RABBITMQ_HOST=rabbitmq
      - DATABASE_URL=postgresql://user:password@db:5432/microservices_db
    depends_on:
      db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - microservice-network

networks:
  microservice-network:
    driver: bridge